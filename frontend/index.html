    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      @keyframes pulse-tech {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes blink-cursor {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      /* 自定义光标隐藏默认鼠标（桌面端） */
      @media (hover: hover) and (pointer: fine) {
        html.cyber-cursor body,
        html.cyber-cursor body * {
          cursor: none !important;
        }
      }
      /* hover 到可交互元素时：目标文字放大 + 变清晰 */
      .cyber-hover-active {
        transform: scale(1.06) !important;
        filter: brightness(1.35) !important;
        transition: transform 0.25s ease, filter 0.25s ease !important;
        text-shadow: 0 0 12px rgba(147,197,253,0.25) !important;
      }
      /* 链接和按钮在 hover 时额外高亮 */
      a.cyber-hover-active,
      button.cyber-hover-active,
      [role="button"].cyber-hover-active {
        color: #93c5fd !important;
      }
    </style>
    <title>XMAX AI Inc | Global AI Inference Service Infrastructure</title>
  </head>
